experiment_id: phase_a_smoke
description: >
  Tiny config-driven smoke test for the Phase A runner. This exercises every
  Phase A model build, YAML config loading, chunk outputs, and resume behavior
  without launching the large sweep.

status: smoke

inputs:
  feature_table_uri: /private/tmp/feature_income_test/feature_table.parquet
  feature_families_uri: /private/tmp/feature_income_test/feature_families.json

outputs:
  results_base_uri: /private/tmp/transit_phase_a_smoke/results
  dashboard_base_uri: /private/tmp/transit_phase_a_smoke/dashboard
  duckdb_path: /private/tmp/transit_phase_a_smoke/experiments.duckdb
  dashboard_export_dir: /private/tmp/transit_phase_a_smoke/dashboard_from_duckdb

forecast:
  target: upt
  horizon: 3
  as_of_start: 2024-01-01
  as_of_end: 2024-06-01
  as_of_frequency_months: 1
  refit_frequency_months: 1
  min_train_rows: 60

execution:
  n_jobs: 2
  chunk_by:
    - model_build
  checkpointing:
    enabled: true
    checkpoint_dir: /private/tmp/transit_phase_a_smoke/checkpoints
    chunk_dir: /private/tmp/transit_phase_a_smoke/chunks
    resume: true
  random_seed: 42

tracking:
  mlflow:
    enabled: false
    tracking_uri: mlruns
    experiment_name: transit-forecasting-phase-a-smoke
    run_name: phase_a_smoke

feature_families:
  include:
    - history_regime_time
    - history_regime_income

modes:
  baseline:
    - raw
  linear:
    - raw
    - residual
  tree:
    - raw
    - residual

feature_policies:
  baseline:
    - none
  linear:
    - none
    - corr_pruned
  tree:
    - none

models:
  baseline:
    seasonal_naive:
      enabled: true
      implementation_status: implemented
      param_grid:
        - {}

  linear:
    ridge:
      enabled: true
      implementation_status: implemented
      param_grid:
        - alpha: 1.0

    lasso:
      enabled: true
      implementation_status: implemented
      param_grid:
        - alpha: 100.0
          max_iter: 5000

    elastic_net:
      enabled: true
      implementation_status: implemented
      param_grid:
        - alpha: 1.0
          l1_ratio: 0.5
          max_iter: 5000

  tree:
    random_forest:
      enabled: true
      implementation_status: implemented
      param_grid:
        - n_estimators: 50
          max_depth: 4
          min_samples_leaf: 3
          max_features: sqrt

    extra_trees:
      enabled: true
      implementation_status: implemented
      param_grid:
        - n_estimators: 50
          max_depth: 4
          min_samples_leaf: 3
          max_features: sqrt

    xgboost:
      enabled: true
      implementation_status: implemented
      param_grid:
        - n_estimators: 50
          max_depth: 3
          learning_rate: 0.05
          subsample: 0.8
          colsample_bytree: 0.8
          min_child_weight: 3
