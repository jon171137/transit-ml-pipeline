experiment_id: phase_c_neural_refinement
description: >
  Evidence-guided Phase C refinement sweep after the first T4 architecture
  screen. It raises epoch ceilings and compares raw selection policies with
  PCA sequence representations without multiplying every selector by every
  representation.

status: draft-review

inputs:
  feature_table_uri: feature_store/income_interactions_h3_v1/feature_table.parquet
  feature_families_uri: feature_store/income_interactions_h3_v1/feature_families.json

outputs:
  results_base_uri: experiments_output/phase_c_neural_refinement/results
  dashboard_base_uri: dashboard_artifacts/aws_streamlined/phase_c_neural_refinement

forecast:
  target: upt
  horizon: 3
  as_of_start: 2016-01-01
  as_of_end: 2025-12-01
  as_of_frequency_months: 3
  min_train_rows: 60

execution:
  device: auto
  random_seed: 42
  deterministic: true
  checkpointing:
    chunk_dir: experiments_output/phase_c_neural_refinement/chunks
    checkpoint_dir: experiments_output/phase_c_neural_refinement/checkpoints
    resume: true

tracking:
  mlflow:
    enabled: false
    tracking_uri: mlruns
    experiment_name: transit-forecasting-phase-c-neural-refinement
    run_name: phase_c_neural_refinement

feature_families:
  include:
    - history_regime_time
    - history_regime_time_all_exog
    - history_regime_income_pressure

modes:
  - raw
  - residual

policy_representation_variants:
  - {feature_policy: none, representation_policy: sequence_raw}
  - {feature_policy: variance_pruned, representation_policy: sequence_raw}
  - {feature_policy: corr_pruned, representation_policy: sequence_raw}
  - {feature_policy: mutual_info_top_30, representation_policy: sequence_raw}
  - {feature_policy: none, representation_policy: sequence_pca_95}
  - {feature_policy: none, representation_policy: sequence_pca_20}

models:
  mlp:
    enabled: true
    param_grid:
      - {sequence_length: 12, hidden_size: 32, num_layers: 1, dropout: 0.0, learning_rate: 0.001, batch_size: 32, max_epochs: 120, early_stopping_patience: 12, lr_patience: 4, validation_rows: 12}
      - {sequence_length: 24, hidden_size: 32, num_layers: 1, dropout: 0.0, learning_rate: 0.001, batch_size: 32, max_epochs: 120, early_stopping_patience: 12, lr_patience: 4, validation_rows: 12}

  rnn:
    enabled: true
    param_grid:
      - {sequence_length: 12, hidden_size: 32, num_layers: 1, dropout: 0.0, learning_rate: 0.001, batch_size: 32, max_epochs: 120, early_stopping_patience: 12, lr_patience: 4, validation_rows: 12}
      - {sequence_length: 24, hidden_size: 32, num_layers: 1, dropout: 0.0, learning_rate: 0.001, batch_size: 32, max_epochs: 120, early_stopping_patience: 12, lr_patience: 4, validation_rows: 12}

  gru:
    enabled: true
    param_grid:
      - {sequence_length: 12, hidden_size: 32, num_layers: 1, dropout: 0.0, learning_rate: 0.001, batch_size: 32, max_epochs: 120, early_stopping_patience: 12, lr_patience: 4, validation_rows: 12}
      - {sequence_length: 24, hidden_size: 64, num_layers: 1, dropout: 0.0, learning_rate: 0.0003, batch_size: 32, max_epochs: 120, early_stopping_patience: 12, lr_patience: 4, validation_rows: 12}
      - {sequence_length: 36, hidden_size: 64, num_layers: 2, dropout: 0.2, learning_rate: 0.0003, batch_size: 32, max_epochs: 120, early_stopping_patience: 12, lr_patience: 4, validation_rows: 12}

  lstm:
    enabled: true
    param_grid:
      - {sequence_length: 12, hidden_size: 32, num_layers: 1, dropout: 0.0, learning_rate: 0.001, batch_size: 32, max_epochs: 120, early_stopping_patience: 12, lr_patience: 4, validation_rows: 12}
      - {sequence_length: 24, hidden_size: 64, num_layers: 1, dropout: 0.0, learning_rate: 0.0003, batch_size: 32, max_epochs: 120, early_stopping_patience: 12, lr_patience: 4, validation_rows: 12}
      - {sequence_length: 36, hidden_size: 64, num_layers: 2, dropout: 0.2, learning_rate: 0.0003, batch_size: 32, max_epochs: 120, early_stopping_patience: 12, lr_patience: 4, validation_rows: 12}
