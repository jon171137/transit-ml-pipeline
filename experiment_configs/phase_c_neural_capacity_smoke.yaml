experiment_id: phase_c_neural_capacity_smoke
description: >
  Tiny CPU contract test for asymmetric recurrent stacks, dense prediction
  heads, and Adam weight decay before launching the Phase C capacity screen.

status: smoke-test

inputs:
  feature_table_uri: feature_store/income_interactions_h3_v1/feature_table.parquet
  feature_families_uri: feature_store/income_interactions_h3_v1/feature_families.json

outputs:
  results_base_uri: /private/tmp/transit_phase_c_neural_capacity_smoke/results
  dashboard_base_uri: /private/tmp/transit_phase_c_neural_capacity_smoke/dashboard

forecast:
  target: upt
  horizon: 3
  as_of_start: 2024-01-01
  as_of_end: 2024-03-01
  as_of_frequency_months: 1
  min_train_rows: 60

execution:
  device: cpu
  random_seed: 42
  deterministic: true
  checkpointing:
    chunk_dir: /private/tmp/transit_phase_c_neural_capacity_smoke/chunks
    checkpoint_dir: /private/tmp/transit_phase_c_neural_capacity_smoke/checkpoints
    resume: true

feature_families:
  include:
    - history_regime_time

modes:
  - residual

policy_representation_variants:
  - {feature_policy: none, representation_policy: sequence_raw}

models:
  lstm:
    enabled: true
    param_grid:
      - {sequence_length: 12, recurrent_hidden_sizes: [64, 16], dropout: 0.1, dense_head_sizes: [20, 10], dense_head_dropouts: [0.3, 0.0], weight_decay: 0.0001, learning_rate: 0.0025, batch_size: 24, max_epochs: 2, early_stopping_patience: 2, lr_patience: 1, validation_rows: 12}

